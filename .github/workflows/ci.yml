# 发布前自动测试：PR 与 push 到 main 时执行语法检查 + 冒烟测试。
# 通过后代码才允许合并 → 发布前的第一道把关（GitHub 云端免费运行）。
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check (all sources)
        run: |
          node --check client/client.js
          node --check lib/index.js
          node --check lib/updater.cjs
          node --check lib/launcher.cjs

      - name: Structural smoke test
        run: node test/smoke.cjs

      - name: Interactive contract test
        run: node test/interactive.cjs

      - name: Version comparison regression test
        run: node test/version.cjs